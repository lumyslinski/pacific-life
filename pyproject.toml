[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-snowflake-emulator"
version = "0.2.0"
description = "A local Snowflake connector service for SQL functions and calculation workers"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.5.5",
  "sqlglot==30.15.0",
  "starlette==1.6.0",
  "uvicorn==0.52.4",
  "snowflake-connector-python==4.7.3",
  "litestar==2.24.0",
  "boto3==1.43.93",
]

[project.optional-dependencies]
test = ["snowflake-connector-python==4.7.3", "pytest==9.1.1"]

[project.scripts]
local-snowflake = "snowflake_emulator.__main__:main"
calculation-api = "calculation_api.__main__:main"

[tool.setuptools.packages.find]
include = ["snowflake_emulator*", "calculation_api*", "fixtures*"]

[tool.setuptools.package-data]
fixtures = ["*.sql", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["aws_local: integration test requiring a loopback DynamoDB or Moto server"]
