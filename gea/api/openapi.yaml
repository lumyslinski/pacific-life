          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/Run'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - Runs
      operationId: getRun
      summary: Read a run with its props, what is missing and its current contract
      description: The ETag covers the whole representation, so it changes whenever a prop, the status or the delivery
        state changes. Poll with If-None-Match.
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Run with per-step completion and its current contract.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/Run'
                  error:
                    type: 'null'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - Runs
      operationId: updateRun
      summary: 'Save the wizard: change props of a draft run'
      x-permission: prepare
      description: 'JSON Merge Patch (RFC 7396): send only the props that changed; null empties a prop. A run with
        required props still missing is saved and answered with 200, with the missing props in `issues`. A value
        of the wrong type or an unknown prop is refused with 422 and nothing is stored. Allowed only while the run
        is `draft`.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/RunPatch'
      responses:
        '200':
          description: Updated run.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/Run'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Runs
      operationId: deleteRun
      summary: Discard a draft Run that was never submitted
      x-permission: prepare
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Draft and its saved steps deleted; `data` is null.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    type: 'null'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/review:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - Runs
      operationId: reviewRun
      summary: Review step - readiness, missing fields and the contract that would be submitted
      description: 'Readiness, every missing prop with its step, and a preview of the contract. The ETag is the
        run''s: send it in If-Match when submitting, so that the contract is exactly what was reviewed.'
      responses:
        '200':
          description: '`preview` has no contractId yet.'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/RunReview'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/submit:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      tags:
      - Runs
      operationId: submitRun
      summary: Submit the run - freeze its configuration into the next contract version and queue it for execution
      x-permission: prepare
      description: 'No request body: the contract is built from what is saved. In one

        PostgreSQL transaction the run is locked, If-Match is compared with its

        current ETag, every required field is verified to be filled, the document is

        assembled and hashed, the contract is stored, its delivery to Snowflake is

        queued and the run moves to `queued`. Snowflake starts executing when the

        contract arrives. The run is locked from this point; change it by cloning,

        or resolve it after a failure. To submit several runs together, in an order

        and with a limit on how many execute at once, create a job instead.

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: 'Run submitted: its contract, or the stored answer of a repeated Idempotency-Key.'
          headers:
            Location:
              $ref: '#/components/headers/Location'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/DataContract'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: '`not_ready`: the run still has missing or invalid fields; `issues`

            lists every one with its step. Or `idempotency_key_reused`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/execution:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - Execution
      operationId: getRunExecution
      summary: 'Where the execution of the run is: delivery, status and every step'
      responses:
        '200':
          description: Execution of the run's current contract version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/RunExecution'
                  error:
                    type: 'null'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown run, or the run has never been submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
      description: 'The execution of the run''s current contract. Before the contract has reached Snowflake the
        status is `queued` and `delivery` says why it has not started (waiting for its turn in a job, a retry after
        a failed attempt). Afterwards every step carries the status Snowflake reported. `lastReportedAt` is the
        heartbeat: an execution that stays silent too long is failed. Poll with If-None-Match.'
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
  /runs/{runId}/logs:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - Execution
      operationId: getRunLogs
      summary: Read the execution log of a run
      description: 'Run.Logs: what Snowflake reported while executing the run''s contracts, and what happened to
        the execution here (cancel, an execution that went silent). Newest first.'
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Log lines, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/RunLogList'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/cancel:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      tags:
      - Execution
      operationId: cancelRun
      summary: Cancel a run that is queued or running
      x-permission: prepare
      description: 'No request body. A run whose contract has not been sent to Snowflake yet is withdrawn: it fails
        at once with the reason in `failureMessage`. A run that is on its way or executing gets `cancelRequestedAt`;
        Snowflake stops before its next step and the run then fails with the reason. There is no status "cancelled":
        a cancelled run is a failed run and is resolved like any other failure. Repeating the call changes nothing.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 'The run: already failed, or with the cancel request recorded.'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/Run'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/resolution:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      tags:
      - Execution
      operationId: resolveRun
      summary: Resolve a failed run - return it to draft to fix and run again, or mark it resolved
      x-permission: prepare
      description: 'Run.ResolutionAction of the workbook. `rerun-with-fixed-config` returns the run to draft: its
        configuration can be changed and the next submit creates contract version n+1; published versions stay untouched.
        `mark-resolved` leaves the run failed and records who accepted the failure and why. A resolved failure no
        longer counts in the project''s `runs.unresolvedFailed`.'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunResolutionRequest'
      responses:
        '200':
          description: The run with its resolution.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/Run'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/contracts:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - Contracts
      operationId: listRunContracts
      summary: List the contract versions of a run
      responses:
        '200':
          description: Contract versions of the run, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/DataContractList'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /runs/{runId}/contracts/{version}:
    parameters:
    - $ref: '#/components/parameters/RunId'
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    get:
      tags:
      - Contracts
      operationId: getRunContract
      summary: Read one contract version of a run
      responses:
        '200':
          description: Exact immutable contract version.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/DataContract'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /contracts/{contractId}:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    get:
      tags:
      - Contracts
      operationId: getContract
      summary: Read a contract by id
      responses:
        '200':
          description: Immutable contract with its current delivery state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/DataContract'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /jobs:
    get:
      tags:
      - Jobs
      operationId: listJobs
      summary: List jobs
      parameters:
      - name: projectId
        in: query
        description: Only the jobs of this project.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/JobStatus'
      - name: q
        in: query
        description: Case-insensitive match on the job name.
        schema:
          type: string
          maxLength: 200
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Jobs, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/JobList'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags:
      - Jobs
      operationId: createJob
      summary: Submit several runs together as one job
      x-permission: prepare
      description: 'A job is a batch: at least two draft runs, each complete. All of them are submitted in one transaction,
        or none is: every run gets its contract and moves to `queued`. The order of `runIds` is the order of execution,
        and `maxParallel` says how many of them execute at once (1 = one after another; omitted or null = no limit).
        A run that fails does not stop the others. A single run needs no job: submit it with `POST /runs/{runId}/submit`.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '201':
          description: Job created and its runs submitted, or the stored answer of a repeated Idempotency-Key.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                  error:
                    type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: '`validation_failed`: a member is wrong, or a run does not exist. `not_ready`: a run is not
            a draft or still has empty required fields; `issues` names every run and field, with a pointer into
            `runIds`. Or `idempotency_key_reused`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /jobs/{jobId}:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
      tags:
      - Jobs
      operationId: getJob
      summary: Read a job with its status and progress
      description: Status, counters, progress and duration are derived from the job's runs, so the ETag changes
        whenever one of them moves. Poll with If-None-Match; list the runs with `GET /runs?jobId=`.
      parameters:
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The job.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/Job'
                  error:
                    type: 'null'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
  /operations/deliveries/{contractId}/retry:
    parameters:
    - $ref: '#/components/parameters/ContractId'
    post:
      tags:
      - Operations
      operationId: retryDelivery
      summary: Send a contract to Snowflake again after its delivery gave up
      x-permission: administer
      description: 'No request body. Only a `failed` delivery can be retried; the same

        document and hash are sent again. Repeating the call is harmless: once

        the delivery is pending again the answer is a 409 `invalid_state`.

        '
      responses:
        '202':
          description: Delivery queued again.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/ContractDelivery'
                  error:
                    type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContractId:
      name: contractId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque value of `nextCursor` from the previous page.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated key of one user action, for example crypto.randomUUID().

        Send the same key when the same request is repeated after a timeout or

        a 5xx; use a new key for a new action.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag the resource was last read or written with.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The ETag already held; an unchanged resource answers 304.
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ETag:
      description: Opaque validator of this representation. Send it back in If-Match or If-None-Match.
      schema:
        type: string
    Location:
      description: Relative URL of the created resource.
      schema:
        type: string
        format: uri-reference
    XRequestId:
      description: Identifier of this request, for support and log correlation.
      schema:
        type: string
  responses:
    NotModified:
      description: Unchanged since the ETag in If-None-Match; no body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    Error:
      description: Any other failure, including 5xx.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: The request cannot be read (malformed JSON, missing Idempotency-Key header).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: '`forbidden`: the caller''s role does not carry the permission this operation needs

        (`x-permission`). The message names the role and what is missing.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 'The resource is in a state that does not allow the change: `locked`

        (submitted run, signed-off project) or `invalid_state` (for example

        resolving a run that has not failed, cancelling one that is not under way).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: '`precondition_failed`: If-Match is stale. Reload the resource and let the user decide.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequired:
      description: '`precondition_required`: the If-Match header is missing.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: '`validation_failed`: a field is unknown, has the wrong type or an option

        that does not exist; `issues` has one entry per field. Also

        `idempotency_key_reused`.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      - service
      - specVersion
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: gea-api
        specVersion:
          type: string
          description: Version of the data contract format this API publishes.
    ErrorCode:
      type: string
      description: Stable, machine-readable reason. Branch on this, not on `message`.
      enum:
      - bad_request
      - unauthorized
      - forbidden
      - not_found
      - locked
      - invalid_state
      - precondition_failed
      - precondition_required
      - idempotency_key_reused
      - validation_failed
      - not_ready
      - internal_error
      - service_unavailable
    Issue:
      type: object
      description: 'One finding about one prop. The same object is used in a run (`issues`: what is still missing),
        in the review and in an error.

        '
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 'required, empty (stored; the run is not ready), unknown_field, invalid_type, unknown_option,
            invalid (refused), not_draft (a run of a job that was already submitted).

            '
        message:
          type: string
          description: Text for the user.
        field:
          type: string
          description: Prop name, e.g. studyPeriod.
        stepKey:
          type: string
          description: Present when the issue belongs to a wizard step.
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the member of the request body, e.g. /benefit/0.
    ApiError:
      type: object
      description: The one error object. It is the value of `error` in the envelope of every failed request.
      required:
      - code
      - message
      - status
      - issues
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: What went wrong, in words that can be shown to the user.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status of the response.
        issues:
          type: array
          description: One entry per field that is wrong or missing; empty when the error is not about fields.
          items:
            $ref: '#/components/schemas/Issue'
        requestId:
          type: string
          description: Value of X-Request-Id; identifies the request in the server log.
    ErrorEnvelope:
      type: object
      description: The body of every failed request (4xx, 5xx).
      required:
      - data
      - error
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiError'
    Revision:
      type: integer
      minimum: 1
    UserRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    DateRange:
      type: object
      additionalProperties: false
      required:
      - start
      - end
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
    Region:
      type: string
      description: 'Project.Region: an Id of gea."Region" (australia, asia, europe, north-america, global).'
      examples:
      - europe
    BusinessPurpose:
      type: string
      description: 'Project.BusinessPurpose: an Id of gea."BusinessPurpose" (rnd, pricing).'
      examples:
      - pricing
    Benefit:
      type: string
      description: 'Project.Benefit: an Id of gea."Benefit" (mortality, morbidity, lapse-persistency, longevity,
        all-mixed).'
      examples:
      - mortality
    ProjectState:
      type: string
      enum:
      - draft
      - in-progress
      - pending-review
      - ready
      - signed-off
    RunStatus:
      type: string
      enum:
      - draft
      - queued
      - running
      - complete
      - failed
    StepStatus:
      type: string
      enum:
      - incomplete
      - complete
    DeliveryTarget:
      type: string
      enum:
      - snowflake
    DeliveryStatus:
      type: string
      enum:
      - pending
      - delivering
      - delivered
      - failed
      - cancelled
      description: 'pending: waiting to be sent (for its turn in a job, or for a retry). delivering: being sent.
        delivered: Snowflake has the contract. failed: gave up after repeated attempts. cancelled: withdrawn before
        it was sent.'
    ExecutionStatus:
      type: string
      enum:
      - queued
      - running
      - complete
      - failed
    ExecutionStepStatus:
      type: string
      enum:
      - pending
      - running
      - complete
      - failed
      - skipped
      - reused
      - pending-rerun
    RoleId:
      type: string
      description: Id of a role, from `GET /roles`. The roles are rows, so a new one needs no new contract.
      examples:
      - viewer
      - preparer
      - reviewer
      - admin
    Permissions:
      type: object
      description: What a role allows. A form asks these before it offers an action.
      required:
      - prepare
      - review
      - administer
      properties:
        prepare:
          type: boolean
          description: Create and change projects and runs, submit, cancel, resolve a failure, clone. This is the
            workbook's "the current user is not a Viewer".
        review:
          type: boolean
          description: Sign off. No operation of this API needs it yet; the database requires it of Project.SignedOffBy.
        administer:
          type: boolean
          description: Give users their role and home region; retry a delivery.
    Role:
      type: object
      description: A role a user can have, and what it allows.
      required:
      - id
      - name
      - permissions
      properties:
        id:
          $ref: '#/components/schemas/RoleId'
        name:
          type: string
          description: The name to display.
        permissions:
          $ref: '#/components/schemas/Permissions'
    RoleList:
      type: object
      required:
      - roles
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    User:
      type: object
      description: 'A user: the home region, the role and what the role allows.'
      required:
      - id
      - name
      - email
      - region
      - regionName
      - role
      - roleName
      - permissions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type:
          - string
          - 'null'
        region:
          $ref: '#/components/schemas/Region'
        regionName:
          type: string
          description: Display name of the home region.
        role:
          $ref: '#/components/schemas/RoleId'
        roleName:
          type: string
          description: Display name of the role.
        permissions:
          $ref: '#/components/schemas/Permissions'
    UserSummary:
      type: object
      description: 'A user as listed: enough to choose a project owner and to see who has which role.'
      required:
      - id
      - name
      - region
      - regionName
      - role
      - roleName
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region:
          $ref: '#/components/schemas/Region'
        regionName:
          type: string
        role:
          $ref: '#/components/schemas/RoleId'
        roleName:
          type: string
    UserList:
      type: object
      required:
      - users
      - nextCursor
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        nextCursor:
          type:
          - string
          - 'null'
          description: Send as `cursor` to get the next page; null on the last page.
    AdministerUserRequest:
      type: object
      description: What an Admin changes about a user. Send the members to change.
      properties:
        role:
          $ref: '#/components/schemas/RoleId'
        region:
          $ref: '#/components/schemas/Region'
      additionalProperties: false
      minProperties: 1
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required:
      - region
      properties:
        region:
          $ref: '#/components/schemas/Region'
    ReferenceItem:
      type: object
      description: One entry of a list the forms choose from.
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: The value the API uses (north-america, rnd, mortality).
        name:
          type: string
          description: The name to display.
    RegionList:
      type: object
      required:
      - regions
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
    BusinessPurposeList:
      type: object
      required:
      - businessPurposes
      properties:
        businessPurposes:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
    BenefitList:
      type: object
      required:
      - benefits
      properties:
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
    TreatyList:
      type: object
      required:
      - treaties
      properties:
        treaties:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
    OptionValue:
      type: object
      required:
      - value
      - label
      properties:
        value:
          type: string
        label:
          type: string
    RunParameter:
      type: object
      description: One createRun field of workbook sheet "POC Data", as it applies in a project.
      required:
      - name
      - displayName
      - step
      - type
      - control
      - required
      - requiredWhen
      - defaultFrom
      - options
      - default
      properties:
        name:
          $ref: '#/components/schemas/ParameterName'
        displayName:
          type: string
        step:
          $ref: '#/components/schemas/StepKey'
        type:
          type: string
          enum:
          - string
          - boolean
          - stringArray
          - dateRange
          - dateRangeList
          description: 'Workbook types string, boolean, array<string>, {start: date, end: date} and array<{start:
            date, end: date}>.'
        control:
          type: string
          enum:
          - text input
          - select
          - multiselect
          - dateRange
          - dateRangeList
        required:
          type: boolean
          description: 'Marked * in the workbook: needed before the run can be submitted.'
        requiredWhen:
          oneOf:
          - type: object
            required:
            - prop
            - equals
            properties:
              prop:
                type: string
              equals: {}
          - type: 'null'
          description: The prop is required only when another prop has this value.
        defaultFrom:
          type:
          - string
          - 'null'
          description: Prop whose value is the default of this one.
        options:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/OptionValue'
          - type: 'null'
          description: Values of a select or multiselect; null for other controls.
        default:
          type:
          - string
          - 'null'
          description: Value to pre-populate, when the scope defines one.
    RunParameters:
      type: object
      required:
      - scope
      - parameters
      properties:
        scope:
          type: object
          required:
          - region
          - businessPurpose
          - benefit
          - investigation
          description: 'What the options were selected for: the project''s region, business purpose and benefits,
            and the investigation asked for.'
          properties:
            region:
              $ref: '#/components/schemas/Region'
            businessPurpose:
              $ref: '#/components/schemas/BusinessPurpose'
            benefit:
              type: array
              items:
                $ref: '#/components/schemas/Benefit'
            investigation:
              type:
              - string
              - 'null'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/RunParameter'
    DatasetList:
      type: object
      required:
      - datasets
      properties:
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceItem'
    RunCounters:
      type: object
      required:
      - count
      - completed
      - active
      - failed
      - draft
      - unresolvedFailed
      properties:
        count:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
          description: Queued or running.
        failed:
          type: integer
          minimum: 0
        draft:
          type: integer
          minimum: 0
        unresolvedFailed:
          type: integer
          minimum: 0
          description: 'Project.UnresolvedFailedRuns: failed runs nobody has resolved yet.'
      description: 'projects[].runs of the workbook: Project.TotalRuns, CompletedRuns, ActiveRuns, FailedRuns, plus
        the drafts and the failures that still wait for a resolution.'
    Project:
      type: object
      description: A project as in workbook sheet "04. API Data" (get_project_list), plus `benefit` and `cycle`
        of createProject.
      required:
      - id
      - name
      - businessPurpose
      - region
      - benefit
      - cycle
      - periodFrom
      - periodTo
      - state
      - description
      - locked
      - inheritedFrom
      - runs
      - jobs
      - analyses
      - portfolioAe
      - owner
      - createdAt
      - updatedAt
      - signedOffAt
      - revision
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        businessPurpose:
          $ref: '#/components/schemas/BusinessPurpose'
        region:
          $ref: '#/components/schemas/Region'
        benefit:
          type: array
          items:
            $ref: '#/components/schemas/Benefit'
        cycle:
          type:
          - string
          - 'null'
          description: 'Project.Period: the business or review cycle, normally a year.'
        periodFrom:
          type:
          - string
          - 'null'
          format: date
        periodTo:
          type:
          - string
          - 'null'
          format: date
        state:
          $ref: '#/components/schemas/ProjectState'
        description:
          type:
          - string
          - 'null'
        locked:
          type: boolean
          description: True once the project is signed off.
        inheritedFrom:
          type:
          - string
          - 'null'
          format: uuid
          description: Project.ParentProjectId.
        runs:
          $ref: '#/components/schemas/RunCounters'
        jobs:
          type: object
          required:
          - count
          properties:
            count:
              type: integer
              minimum: 0
          description: 'Project.JobCount: the jobs submitted in this project.'
        analyses:
          type: object
          required:
          - count
          properties:
            count:
              type: integer
              minimum: 0
          description: 'Analyses do not exist yet: the count is 0.'
        portfolioAe:
          type:
          - number
          - 'null'
          description: Portfolio actual-to-expected ratio; null until runs produce results.
        owner:
          $ref: '#/components/schemas/UserRef'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        signedOffAt:
          type:
          - string
          - 'null'
          format: date-time
        revision:
          $ref: '#/components/schemas/Revision'
    ProjectList:
      type: object
      required:
      - projects
      - nextCursor
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        nextCursor:
          type:
          - string
          - 'null'
          description: Send as `cursor` to get the next page; null on the last page.
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - region
      - businessPurpose
      - benefit
      description: createProject. name, region, businessPurpose and benefit are the props of sheet "POC Data"; the
        others are those of sheet "04. API Data".
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        region:
          $ref: '#/components/schemas/Region'
        businessPurpose:
          $ref: '#/components/schemas/BusinessPurpose'
        benefit:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Benefit'
        cycle:
          type:
          - string
          - 'null'
          maxLength: 50
        periodFrom:
          type:
          - string
          - 'null'
          format: date
        periodTo:
          type:
          - string
          - 'null'
          format: date
        owner:
          type:
          - string
          - 'null'
          format: uuid
          description: User id; the caller when omitted.
        description:
          type:
          - string
          - 'null'
          maxLength: 4000
        inheritedFrom:
          type:
          - string
          - 'null'
          format: uuid
          description: Id of the project from which context is inherited.
        state:
          type: string
          enum:
          - draft
          - in-progress
          default: in-progress
          description: Initial project state.
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 'JSON Merge Patch: only the members that change; null empties an optional member. Region and
        business purpose are fixed at creation.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        benefit:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Benefit'
        cycle:
          type:
          - string
          - 'null'
          maxLength: 50
        periodFrom:
          type:
          - string
          - 'null'
          format: date
        periodTo:
          type:
          - string
          - 'null'
          format: date
        owner:
          type: string
          format: uuid
        description:
          type:
          - string
          - 'null'
          maxLength: 4000
    RunStep:
      type: object
      required:
      - key
      - title
      - ordinal
      - status
      - missing
      description: One step of the wizard and whether its required props are filled in.
      properties:
        key:
          $ref: '#/components/schemas/StepKey'
        title:
          type: string
        ordinal:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/StepStatus'
        missing:
          type: array
          items:
            type: string
          description: Required props of the step that are still empty.
    ContractRef:
      type: object
      required:
      - contractId
      - version
      - contentHash
      - snowflakeDelivery
      properties:
        contractId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        contentHash:
          $ref: '#/components/schemas/ContentHash'
        snowflakeDelivery:
          $ref: '#/components/schemas/DeliveryStatus'
      description: The contract the run was last submitted with.
    Run:
      allOf:
      - $ref: '#/components/schemas/RunConfiguration'
      - type: object
        required:
        - id
        - projectId
        - name
        - treaty
        - region
        - status
        - locked
        - cloneSourceId
        - steps
        - issues
        - ready
        - currentContract
        - submittedAt
        - submittedBy
        - failureMessage
        - jobId
        - cancelRequestedAt
        - resolution
        - revision
        - createdAt
        - updatedAt
        properties:
          id:
            type: string
            format: uuid
          projectId:
            type: string
            format: uuid
          name:
            type: string
            description: createRun.name.
          treaty:
            type: string
            description: createRun.treaty.
          region:
            $ref: '#/components/schemas/Region'
          status:
            $ref: '#/components/schemas/RunStatus'
          locked:
            type: boolean
            description: 'Run.Locked: true once the run has been submitted (status other than draft).'
          cloneSourceId:
            type:
            - string
            - 'null'
            format: uuid
          steps:
            type: array
            items:
              $ref: '#/components/schemas/RunStep'
          issues:
            type: array
            items:
              $ref: '#/components/schemas/Issue'
            description: Required props that are still empty, in workbook order.
          ready:
            type: boolean
            description: 'True when the run is a draft and nothing is missing: it can be submitted.'
          currentContract:
            oneOf:
            - $ref: '#/components/schemas/ContractRef'
            - type: 'null'
          submittedAt:
            type:
            - string
            - 'null'
            format: date-time
          submittedBy:
            oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
          failureMessage:
            type:
            - string
            - 'null'
          jobId:
            type:
            - string
            - 'null'
            format: uuid
            description: 'Run.JobId: the job the run was submitted with; null for a run submitted on its own.'
          cancelRequestedAt:
            type:
            - string
            - 'null'
            format: date-time
            description: Set when a cancel was requested for the current execution.
          resolution:
            oneOf:
            - $ref: '#/components/schemas/RunResolution'
            - type: 'null'
          revision:
            $ref: '#/components/schemas/Revision'
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
      description: 'A run: its identity, every createRun prop of the workbook, and what is still missing.'
    RunSummary:
      type: object
      description: One row of the runs list.
      required:
      - id
      - projectId
      - projectName
      - name
      - treaty
      - region
      - status
      - locked
      - steps
      - completeSteps
      - ready
      - currentContractVersion
      - snowflakeDelivery
      - jobId
      - jobOrdinal
      - resolutionAction
      - cancelRequestedAt
      - revision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        projectName:
          type: string
        name:
          type: string
        treaty:
          type: string
        region:
          $ref: '#/components/schemas/Region'
        status:
          $ref: '#/components/schemas/RunStatus'
        locked:
          type: boolean
        steps:
          type: integer
          minimum: 0
          description: Number of wizard steps.
        completeSteps:
          type: integer
          minimum: 0
        ready:
          type: boolean
        currentContractVersion:
          type:
          - integer
          - 'null'
          minimum: 1
        snowflakeDelivery:
          oneOf:
          - $ref: '#/components/schemas/DeliveryStatus'
          - type: 'null'
        jobId:
          type:
          - string
          - 'null'
          format: uuid
        jobOrdinal:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 'Position of the run in its job: the order of execution.'
        resolutionAction:
          oneOf:
          - $ref: '#/components/schemas/ResolutionAction'
          - type: 'null'
        cancelRequestedAt:
          type:
          - string
          - 'null'
          format: date-time
        revision:
          $ref: '#/components/schemas/Revision'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RunList:
      type: object
      required:
      - runs
      - nextCursor
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        nextCursor:
          type:
          - string
          - 'null'
          description: Send as `cursor` to get the next page; null on the last page.
    RunReview:
      type: object
      required:
      - runId
      - ready
      - issues
      - steps
      - nextContractVersion
      - preview
      properties:
        runId:
          type: string
          format: uuid
        ready:
          type: boolean
          description: True when nothing is missing and the run is a draft.
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RunStep'
        nextContractVersion:
          type: integer
          minimum: 1
        preview:
          $ref: '#/components/schemas/DataContractDocument'
    ContentHash:
      type: string
      pattern: ^[a-f0-9]{64}$
      description: SHA-256 of the canonical JSON document (sorted keys, compact separators, UTF-8).
    ContractStep:
      type: object
      required:
