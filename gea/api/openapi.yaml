openapi: 3.1.0
info:
  title: PL Re GEA API - projects, run configuration and data contracts
  version: 0.5.0
  description: "A user creates a Project, then a Run inside it. The Run is a server-side\ndraft: it is created with\
    \ a name and a treaty and filled in as the user goes\nthrough the wizard; every save is a PATCH of the fields\
    \ that changed.\nSubmitting freezes the configuration into an immutable, versioned Data\nContract (project id,\
    \ run id, ordered steps) that is stored in PostgreSQL and\ndelivered unchanged to Snowflake. Snowflake executes\
    \ the steps; this API never\ncomputes anything itself. It decides when a run may start (on its own, or in\n\
    the order and with the parallelism of its Job), shows where the execution is,\nand takes the decisions about\
    \ it: cancel it, resolve a failure.\n\nThe routes are named after what the business calls things: projects,\
    \ runs,\njobs, treaties, datasets, run parameters, submit, resolution. The fields are\nthose of workbook sheet\
    \ \"POC Data\" (`createProject.*`, `createRun.*`) under\ntheir workbook names.\n\nConventions (the same for\
    \ every operation):\n- **One envelope.** Every response body is `{\"data\": ..., \"error\": ...}` and\n  exactly\
    \ one of the two is null. On success (2xx) `data` is the resource; a\n  list is named after what it lists (`{projects,\
    \ nextCursor}`, `{runs,\n  nextCursor}`, `{regions}`). On failure (4xx, 5xx) `error` has a stable\n  `code`,\
    \ a `message` to show the user and one entry per field in `issues`.\n  The HTTP status always says which of\
    \ the two it is. The only response\n  without a body is 304 Not Modified.\n- **Idempotency**: a POST that creates\
    \ something carries an\n  `Idempotency-Key` header. Repeating the request with the same key returns\n  the first\
    \ answer; the same key with a different request is a 422\n  `idempotency_key_reused`.\n- **Optimistic concurrency**:\
    \ every single resource is returned with an\n  `ETag`. A change (PATCH, DELETE, submit, resolution, cancel)\
    \ sends it back in\n  `If-Match`; a stale value is a 412 `precondition_failed` and the client\n  reloads, a\
    \ missing header is a 428 `precondition_required`.\n- **Conditional reads**: send the ETag in `If-None-Match`;\
    \ an unchanged\n  resource answers 304 without a body. This is how a run or a job is polled.\n- **Actions**\
    \ are a POST on what the user does, below the resource:\n  `/runs/{runId}/submit`, `/runs/{runId}/cancel`, `/runs/{runId}/resolution`.\n\
    - **Roles**: a user has one role, and a role is three permissions: `prepare`\n  (create and change projects\
    \ and runs, submit, cancel, resolve), `review`\n  (sign off) and `administer` (users, operations). Reading needs\
    \ none. An\n  operation that needs a permission says so in `x-permission` and answers 403\n  `forbidden` to\
    \ a caller without it, before it looks at anything else.\n  `GET /users/me` returns the caller's `permissions`;\
    \ ask those, not the role.\n- Every answer carries `X-Request-Id`; an error repeats it as `requestId`.\n- A\
    \ member is always present; when it has no value it is null. Dates are\n  `YYYY-MM-DD`, timestamps UTC ISO 8601,\
    \ select values are option values.\n"
servers:
- url: http://localhost:8010/gea/v1
  description: Local Litestar API (python -m gea_api)
- url: https://{apiHost}/gea/v1
  description: Deployed API
  variables:
    apiHost:
      default: api.example.com
security:
- bearerAuth: []
tags:
- name: Health
  description: Liveness, without authentication.
- name: Users
  description: The caller, with the role and what it allows; the people a project can be given to; and, for an Admin,
    giving a user a role and a home region.
- name: Reference data
  description: 'The lists the forms choose from: roles, regions, business purposes, benefits, treaties, datasets.'
- name: Projects
  description: Study projects. A project fixes the scope (region, business purpose, benefits) its runs are created
    in, and with it the run parameters.
- name: Runs
  description: 'A configured study inside a project: a draft that is saved as the wizard is filled in, locked once
    it is submitted.'
- name: Execution
  description: 'What happens after submit: where the run is, its log, cancelling it and resolving a failure. Snowflake
    executes; these routes observe and decide.'
- name: Jobs
  description: Several runs submitted together, in a given order and with a limit on how many execute at once.
- name: Contracts
  description: The immutable data contracts a run was submitted with.
- name: Operations
  description: For the people who run the platform, not for the wizard.
