# Alembic configuration of the GEA PostgreSQL schema.
#   alembic -c gea/db/postgres/alembic.ini upgrade head
# The database URL comes from GEA_DATABASE_URL (or -x url=...), never from this file.

[alembic]
script_location = %(here)s/migrations
# The revisions import migrations/gea_sql.py.
prepend_sys_path = %(here)s/migrations
# Readable, ordered file names: 0006_add_job_tables.py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
