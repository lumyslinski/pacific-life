services:
  snowflake-emulator:
    build: .
    command: ["python", "-m", "snowflake_emulator", "--host", "0.0.0.0", "--port", "8084", "--database", "/data/emulator.duckdb", "--history", "/data/query-history.jsonl"]
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - emulator-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/_emulator/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  calculation-api:
    build: .
    command: ["sh", "-c", "python -m calculation_api.bootstrap && python -m calculation_api --host 0.0.0.0 --port 8000"]
    environment:
      EMULATOR_HOST: snowflake-emulator
      EMULATOR_PORT: "8084"
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:4200,http://localhost:5173
    depends_on:
      snowflake-emulator:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # Copies committed audit events to PostgreSQL: docker compose --profile audit up
  audit-export:
    profiles: ["audit"]
    build: .
    command: ["python", "-m", "calculation_api.audit_export"]
    environment:
      EMULATOR_HOST: snowflake-emulator
      EMULATOR_PORT: "8084"
      AUDIT_DATABASE_URL: postgresql://calc_audit_exporter:calc_audit_exporter@postgres:5432/gea    # member of calc_audit
    depends_on:
      snowflake-emulator:
        condition: service_healthy
      calculation-api:
        condition: service_started
      gea-migrate:
        condition: service_completed_successfully
    restart: on-failure

  # GEA module: docker compose --profile gea up. PostgreSQL and its migration also serve the audit profile.
  postgres:
    profiles: ["gea", "audit"]
    image: postgres:16
    environment:
      POSTGRES_DB: gea
      POSTGRES_USER: gea_owner
      POSTGRES_PASSWORD: gea_owner          # local development only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gea-postgres:/var/lib/postgresql/data
      - ./gea/db/postgres/local/init-roles.sql:/docker-entrypoint-initdb.d/10-gea-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gea_owner -d gea"]
      interval: 2s
      timeout: 3s
      retries: 30

  gea-migrate:
    profiles: ["gea", "audit"]
    build: .
    command: ["alembic", "-c", "gea/db/postgres/alembic.ini", "upgrade", "head"]
    environment:
      GEA_DATABASE_URL: postgresql://gea_owner:gea_owner@postgres:5432/gea
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gea-api:
    profiles: ["gea"]
    build: .
    command: ["python", "-m", "gea_api", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      GEA_DATABASE_URL: postgresql://gea_api:gea_api@postgres:5432/gea    # member of gea_app, not the owner
      GEA_AUTH_MODE: dev                                                  # local development only
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:4200,http://localhost:5173
    depends_on:
      gea-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8010:8010"

volumes:
  emulator-data:
  gea-postgres:
