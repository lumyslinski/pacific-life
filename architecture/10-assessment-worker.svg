<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1420" viewBox="0 0 1680 1420" role="img">
<title>10 The business calculation journey</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1680" height="1420" fill="#FFFFFF"/>
<rect x="40" y="24" width="1600" height="46" fill="#FFFFFF"/>
<text x="40" y="56.86" text-anchor="start" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172B46">Core → Silver, then custom processes · deployment responsibilities</text>
<rect x="40" y="78" width="1600" height="34" fill="#FFFFFF"/>
<text x="40" y="100.78" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#738096">The background worker organises the work. Snowflake performs the arithmetic. The application shows the saved outcome.</text>
<rect x="50" y="145" width="480" height="155" rx="3" fill="#F5E3D0" stroke="#95612E" stroke-width="1.7"/>
<rect x="62" y="155" width="456" height="135" fill="#FFFFFF"/>
<text x="290.0" y="198.73999999999998" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">BRONZE · Original policy model</text>
<text x="290.0" y="229.98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">{ DeathPenatly: 1000 }</text>
<text x="290.0" y="261.21999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">Core rule: cap the amount at 800</text>
<rect x="600" y="145" width="480" height="155" rx="3" fill="#E7EBF0" stroke="#738096" stroke-width="1.7"/>
<rect x="612" y="155" width="456" height="135" fill="#FFFFFF"/>
<text x="840.0" y="198.73999999999998" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">SILVER · Immutable core model</text>
<text x="840.0" y="229.98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">{ DeathPenatly: 800 }</text>
<text x="840.0" y="261.21999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">Core phase output; immutable</text>
<rect x="1150" y="145" width="480" height="155" rx="3" fill="#EAF2FF" stroke="#356CC9" stroke-width="1.7"/>
<rect x="1162" y="155" width="456" height="135" fill="#FFFFFF"/>
<text x="1390.0" y="198.73999999999998" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">CUSTOM INPUT · Regional example</text>
<text x="1390.0" y="229.98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">{ DeathPenatly: 700 }</text>
<text x="1390.0" y="261.21999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">User overrides DeathPenatly to 700</text>
<polyline points="530,222 600,222" fill="none" stroke="#738096" stroke-width="1.7" marker-end="url(#arrow)"/>
<polyline points="1080,222 1150,222" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="50" y="365" width="1580" height="38" fill="#FFFFFF"/>
<text x="50" y="391.48" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172B46">AFTER CORE SUCCEEDS · THE USER SELECTS A CUSTOM PROCESS (EXAMPLE: REGIONAL)</text>
<rect x="50" y="455" width="350" height="180" rx="3" fill="#FFFFFF" stroke="#356CC9" stroke-width="1.7"/>
<rect x="62" y="465" width="326" height="160" fill="#FFFFFF"/>
<text x="225.0" y="507.40999999999997" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172B46">User clicks Calculate</text>
<text x="225.0" y="537.23" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172B46">Silver + input override:</text>
<text x="225.0" y="567.05" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172B46">{ DeathPenatly: 700 }</text>
<text x="225.0" y="596.87" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172B46">The screen remains usable</text>
<rect x="540" y="455" width="500" height="180" rx="3" fill="#FFFFFF" stroke="#356CC9" stroke-width="1.7"/>
<rect x="552" y="465" width="476" height="160" fill="#FFFFFF"/>
<text x="790.0" y="495.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Calculation application · Litestar</text>
<text x="790.0" y="523.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Read the published Data Contract</text>
<text x="790.0" y="551.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Validate and save the fixed input and rules</text>
<text x="790.0" y="580.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Return a reference and show Waiting</text>
<text x="790.0" y="608.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Full actor sequence: page 11</text>
<rect x="1180" y="455" width="450" height="180" rx="3" fill="#FFFFFF" stroke="#356CC9" stroke-width="1.7"/>
<rect x="1192" y="465" width="426" height="160" fill="#FFFFFF"/>
<text x="1405.0" y="509.2" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Amazon Simple Queue Service</text>
<text x="1405.0" y="537.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Background job waiting list hosted in AWS</text>
<text x="1405.0" y="566.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Holds saved calculation references</text>
<text x="1405.0" y="594.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">A worker starts when it picks one up</text>
<polyline points="400,545 540,545" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="409" y="500" width="122" height="32" fill="#FFFFFF"/>
<text x="470.0" y="521.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#356CC9">Request</text>
<polyline points="1040,545 1180,545" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="1049" y="500" width="122" height="32" fill="#FFFFFF"/>
<text x="1110.0" y="521.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#356CC9">Queue work</text>
<rect x="50" y="805" width="350" height="235" rx="3" fill="#FFFFFF" stroke="#356CC9" stroke-width="1.7"/>
<rect x="62" y="815" width="326" height="215" fill="#FFFFFF"/>
<text x="225.0" y="861.51" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172B46">The screen follows progress</text>
<text x="225.0" y="888.49" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172B46">Waiting → Calculating</text>
<text x="225.0" y="915.47" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172B46">Automatically checks saved status</text>
<text x="225.0" y="942.45" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172B46">Closing the browser does not</text>
<text x="225.0" y="969.43" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172B46">stop the background calculation</text>
<text x="225.0" y="996.41" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#172B46">Return later to see the outcome</text>
<rect x="540" y="765" width="500" height="295" rx="3" fill="#FFFFFF" stroke="#356CC9" stroke-width="1.7"/>
<rect x="552" y="775" width="476" height="275" fill="#FFFFFF"/>
<text x="790.0" y="841.94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172B46">PYTHON CALCULATION WORKER</text>
<text x="790.0" y="867.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172B46">Separate container running on AWS Fargate</text>
<text x="790.0" y="893.0600000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172B46"></text>
<text x="790.0" y="918.62" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172B46">1. Receive a request from the Amazon queue</text>
<text x="790.0" y="944.1800000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172B46">2. Load its fixed model and rules</text>
<text x="790.0" y="969.74" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172B46">3. Use CalculationWorker.run() to call Snowflake</text>
<text x="790.0" y="995.3000000000001" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172B46">4. Save the result or failure and finish the job</text>
<rect x="1180" y="765" width="450" height="295" rx="3" fill="#E8F4EB" stroke="#24795C" stroke-width="1.7"/>
<rect x="1192" y="775" width="426" height="275" fill="#FFFFFF"/>
<text x="1405.0" y="834.0999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">SNOWFLAKE · CALCULATES THE VALUE</text>
<text x="1405.0" y="862.4999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Input: { DeathPenatly: 700 }</text>
<text x="1405.0" y="890.8999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46"></text>
<text x="1405.0" y="919.3" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Regional rule: reduce the amount by 10%</text>
<text x="1405.0" y="947.6999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">700 × 0.90 = 630</text>
<text x="1405.0" y="976.0999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46"></text>
<text x="1405.0" y="1004.4999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#172B46">Return 630, or a calculation error</text>
<polyline points="1405,635 1405,700 790,700 790,765" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="540" y="654" width="1020" height="34" fill="#FFFFFF"/>
<text x="1050.0" y="676.78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172B46">A separate Python delivery process forwards saved requests from Snowflake into the Amazon queue.</text>
<rect x="935" y="718" width="650" height="34" fill="#FFFFFF"/>
<text x="1260.0" y="741.12" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#172B46">An available Python worker receives the queued request</text>
<polyline points="1040,860 1180,860" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="1049" y="815" width="122" height="32" fill="#FFFFFF"/>
<text x="1110.0" y="836.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#356CC9">Calculate</text>
<polyline points="1180,980 1040,980" fill="none" stroke="#24795C" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="1049" y="935" width="122" height="32" fill="#FFFFFF"/>
<text x="1110.0" y="956.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#24795C">Value / error</text>
<polyline points="790,1060 790,1120 410,1120 410,1180" fill="none" stroke="#24795C" stroke-width="1.7" marker-end="url(#arrow)"/>
<polyline points="790,1120 1210,1120 1210,1180" fill="none" stroke="#B04444" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="50" y="1180" width="720" height="155" rx="3" fill="#FFF0B8" stroke="#A96915" stroke-width="1.7"/>
<rect x="62" y="1190" width="696" height="135" fill="#FFFFFF"/>
<text x="410.0" y="1233.74" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">SUCCESS · save GOLD and mark Ready together</text>
<text x="410.0" y="1264.98" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">{ DeathPenatly: 630 }</text>
<text x="410.0" y="1296.22" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172B46">The application displays the completed regional model</text>
<rect x="850" y="1180" width="780" height="155" rx="3" fill="#FBEDED" stroke="#B04444" stroke-width="1.7"/>
<rect x="862" y="1190" width="756" height="135" fill="#FFFFFF"/>
<text x="1240.0" y="1234.8200000000002" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172B46">FAILURE · save the reason and mark Failed</text>
<text x="1240.0" y="1264.64" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172B46">The application shows what failed and the available retry</text>
<text x="1240.0" y="1294.4600000000003" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172B46">Preserve the core model and all earlier completed results</text>
<rect x="50" y="1360" width="1580" height="32" fill="#FFFFFF"/>
<text x="840.0" y="1381.78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#172B46">Proposed deployment: Amazon Elastic Container Service keeps the Python worker running on AWS Fargate. This queue consumer is not implemented yet.</text>
</svg>
