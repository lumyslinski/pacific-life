<rect x="567" y="494" width="376" height="23" fill="#FFFFFF"/>
<text x="755.0" y="510.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">SELECT run FOR UPDATE; compare the ETag</text>
