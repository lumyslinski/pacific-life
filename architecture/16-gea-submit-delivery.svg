<rect x="567" y="439" width="376" height="23" fill="#FFFFFF"/>
<text x="755.0" y="455.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">BEGIN; receipt for (caller, key)? then replay it</text>
