<rect x="177" y="614" width="376" height="23" fill="#FFFFFF"/>
<text x="365.0" y="630.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">412 precondition_failed · 422 not_ready + issues</text>
<polyline points="560,740 950,740" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="567" y="691" width="376" height="46" fill="#FFFFFF"/>
<text x="755.0" y="708.8199999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">build document; canonical JSON; SHA-256; INSERT</text>
<text x="755.0" y="728.6999999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">DataContract</text>
<rect x="968" y="752" width="330" height="64" fill="#FFFFFF"/>
<text x="968" y="768.88" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#738096">triggers: hash and document must equal</text>
<text x="968" y="788.76" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#738096">the saved columns; queue the delivery;</text>
<text x="968" y="808.64" text-anchor="start" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#738096">run moves to queued</text>
<polyline points="560,860 950,860" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="567" y="834" width="376" height="23" fill="#FFFFFF"/>
<text x="755.0" y="850.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">store the receipt and the audit event; COMMIT</text>
<polyline points="560,915 170,915" fill="none" stroke="#24795C" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="177" y="889" width="376" height="23" fill="#FFFFFF"/>
<text x="365.0" y="905.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">201: the contract + Location; the run is locked</text>
<rect x="830" y="965" width="1030" height="555" rx="3" fill="none" stroke="#738096" stroke-width="1.7" stroke-dasharray="7 5"/>
<rect x="842" y="948" width="523" height="34" fill="#FFFFFF"/>
<text x="842" y="970.44" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#738096">after the commit · independent of the request</text>
<polyline points="1340,1040 950,1040" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="957" y="991" width="376" height="46" fill="#FFFFFF"/>
<text x="1145.0" y="1008.8199999999999" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">ClaimContractDeliveries(): contracts allowed to</text>
<text x="1145.0" y="1028.7" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">start</text>
<polyline points="950,1095 1340,1095" fill="none" stroke="#24795C" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="957" y="1069" width="376" height="23" fill="#FFFFFF"/>
<text x="1145.0" y="1085.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">DocumentCanonical + ContentHash</text>
<polyline points="1340,1150 1720,1150" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="1347" y="1124" width="366" height="23" fill="#FFFFFF"/>
<text x="1530.0" y="1140.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">MERGE DATA_CONTRACT: same id, same hash</text>
<polyline points="1720,1205 1340,1205" fill="none" stroke="#24795C" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="1347" y="1179" width="366" height="23" fill="#FFFFFF"/>
<text x="1530.0" y="1195.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">stored; SHA2 matches</text>
<polyline points="1340,1260 1720,1260" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="1347" y="1234" width="366" height="23" fill="#FFFFFF"/>
<text x="1530.0" y="1250.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">EXECUTE TASK RUN_PIPELINE (contractId)</text>
<polyline points="1340,1315 950,1315" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="957" y="1289" width="376" height="23" fill="#FFFFFF"/>
<text x="1145.0" y="1305.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">CompleteContractDelivery()</text>
<rect x="1585" y="1333" width="270" height="26" fill="#FFFFFF"/>
<text x="1720.0" y="1350.76" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#738096">task graph runs the steps (page 17)</text>
<polyline points="1340,1405 1720,1405" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="1347" y="1379" width="366" height="23" fill="#FFFFFF"/>
<text x="1530.0" y="1395.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">read RUN_STATUS, RUN_STEP_STATUS, RUN_LOG</text>
<polyline points="1340,1465 950,1465" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="957" y="1439" width="376" height="23" fill="#FFFFFF"/>
<text x="1145.0" y="1455.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">RecordExecutionStatus(), RecordExecutionLog()</text>
<polyline points="170,1575 560,1575" fill="none" stroke="#356CC9" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="177" y="1549" width="376" height="23" fill="#FFFFFF"/>
<text x="365.0" y="1565.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">GET /runs/{id}/execution · If-None-Match (polling)</text>
<polyline points="560,1630 170,1630" fill="none" stroke="#24795C" stroke-width="1.7" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="177" y="1604" width="376" height="23" fill="#FFFFFF"/>
<text x="365.0" y="1620.26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#172B46">304 unchanged · or 200: status of every step</text>
<rect x="40" y="1685" width="1820" height="28" fill="#FFFFFF"/>
<text x="950.0" y="1704.44" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172B46">A failed Snowflake write never undoes the contract: the delivery stays pending and is retried with the same document and hash.</text>
<rect x="40" y="1723" width="1820" height="28" fill="#FFFFFF"/>
<text x="950.0" y="1742.44" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#172B46">Repeating the submit with the same Idempotency-Key returns the same contract. A failed run is resolved (POST /runs/{id}/resolution) and resubmitted as version n + 1.</text>
</svg>
